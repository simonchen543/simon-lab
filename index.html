<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simon Lab</title>
<style>
:root{--bg:#f4efe4;--ink:#23241f;--muted:#7d7466;--line:#d6ccb9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c18;--ink:#ece6d8;--muted:#a39985;--line:#3e3b32;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1c18;--ink:#ece6d8;--muted:#a39985;--line:#3e3b32;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;line-height:1.8}
main{max-width:640px;margin:0 auto;padding:18vh 16px 40px}
h1{font-weight:500;font-size:28px;letter-spacing:.06em;margin:0 0 8px}
p{color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<main>
<h1>Simon Lab</h1>
<p>整理中。</p>
</main>
</body>
</html>
